name: Build VoucherPlugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozitare
        uses: actions/checkout@v4

      - name: Nastaveni JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build pluginu (Maven)
        run: mvn -B clean package

      - name: Nahrani .jar jako artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoucherPlugin
          path: target/VoucherPlugin.jar
